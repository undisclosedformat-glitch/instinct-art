<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Daily Art Loop — Instinct</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0b0d12; color: #9aa3b2; font-family: Georgia, 'Times New Roman', serif; }
  main { text-align: center; padding: 2rem; }
  .window { width: 84px; height: 110px; margin: 0 auto 1.6rem; border: 2px solid #2a3242;
            border-radius: 3px; background: #10141c; position: relative; }
  .window::before, .window::after { content: ""; position: absolute; background: #2a3242; }
  .window::before { left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; }
  .window::after { top: 50%; left: 0; right: 0; height: 2px; margin-top: -1px; }
  h1 { font-size: 1.15rem; font-weight: normal; letter-spacing: 0.04em; margin: 0 0 .5rem; color: #c9d1de; }
  p  { font-size: .95rem; margin: .25rem 0; }
  a  { color: #7fa0c9; text-decoration: none; border-bottom: 1px solid #33415a; }
  a:hover { border-bottom-color: #7fa0c9; }
</style>
</head>
<body>
<main>
  <div class="window" aria-hidden="true"></div>
  <h1>The window is dark.</h1>
  <p>A daily art loop lives here soon. One piece a morning, painted from the previous day's real work.</p>
  <p><a href="https://undisclosedformat-glitch.github.io/daily-art/">the lit window across the street →</a></p>
</main>
</body>
</html>
